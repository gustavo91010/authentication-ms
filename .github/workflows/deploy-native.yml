name: Build and Push Native Image

on:
  push:
    tags:
      - 'v*'

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from Git tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Native Image and Push
        env:
          BP_NATIVE_IMAGE_BUILD_ARGUMENTS: "-H:+UnlockExperimentalVMOptions --initialize-at-run-time=sun.security.util.Password$ConsoleHolder,jdk.internal.io.JdkConsoleImpl$1ConsoleHolder,sun.security.util.Password"
          PORTS: 8082
          ENVIROMENT: build
          MONGO_URI: mongodb://localhost:27017/build
          AWS_REGION: us-east-1
          AWS_ID: 123456789
          APP_URL: localhost
          APP_NAME: porteiro-api
          VERSION: ${{ steps.version.outputs.version }}
          CONTACT: build@example.com
          GITHUB_REDIRECT_URI: http://localhost
          GITHUB_CLIENT_ID: fake
          GITHUB_CLIENT_SECRET: fake
          GOOGLE_REDIRECT_URI: http://localhost
          GOOGLE_CLIENT_ID: fake
          GOOGLE_CLIENT_SECRET: fake
          EMAIL_USERNAME: fake
          EMAIL_PASSWORD: fake
        run: |
          ./mvnw -Pnative spring-boot:build-image \
            -Dspring-boot.build-image.imageName=gustavodocker910/porteiro-api:${{ steps.version.outputs.version }} \
            -DskipTests
          
          docker tag gustavodocker910/porteiro-api:${{ steps.version.outputs.version }} gustavodocker910/porteiro-api:latest
          
          docker push gustavodocker910/porteiro-api:${{ steps.version.outputs.version }}
          docker push gustavodocker910/porteiro-api:latest
