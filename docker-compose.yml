services:
  postgres:
    image: postgres:15
    container_name: auth_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: auth
    ports:
      - "5432:5432"

  authentication-api:
    build: .
    container_name: auth-api
    env_file:
      - .env
    ports:
      - "${PORTS}:${PORTS}"
    depends_on:
      - postgres
    volumes:
      - volume_authentication:/data

volumes:
  volume_authentication:
