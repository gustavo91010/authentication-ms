info.app.environment=${ENVIROMENT:dev}
info.app.description=Sistema de autentica\u00e7\u00e3o para m\u00faltiplas aplica\u00e7\u00f5es
info.app.url=${APP_URL:localhost}
info.app.name=${APP_NAME:porteiro-api}
