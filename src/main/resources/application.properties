server.port=${PORTS:8082}
app.info.enviroment=${ENVIROMENT:dev}
# senha do usuairo padrão: ajudaqui / @Ajudaqui
app.auth.master=${APP_AUTH_MASTER:77a1e032-823a-4793-ac96-2e34567b3059}

# Database
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/porteiro}
spring.data.mongodb.auto-index-creation=true
mongock.migration-scan-package=com.ajudaqui.porteiro.config.dbmigrations

# App Properties
bezkoder.app.jwtSecret=${JWT_SECRET:ajudaqui-ms}
bezkoder.app.jwtExpirationMs=${JWT_EXPIRATION:86400000}

# Trabalha jundo com o handle exception na exceção:NoHandlerFoundException
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

